<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CineMatch — intro</title>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0e1a; color: #fff; overflow: hidden; height: 100%; }

  .cm-stage {
    position: relative;
    width: 100%; height: 100vh;
    background: #0a0e1a;
    overflow: hidden;
  }
  .cm-stage video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #0a0e1a;
    pointer-events: none;
  }

  .cm-overlay {
    position: absolute; inset: 0;
    pointer-events: none; color: white;
    font-family: 'Heebo', 'Inter', system-ui, -apple-system, sans-serif;
    text-shadow: 0 2px 28px rgba(0,0,0,0.85), 0 0 60px rgba(0,0,0,0.55);
  }

  /* Setup lines (1 + 2) — centered. Fade in, then fade out before the face freezes. */
  .cm-tease {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center;
    padding: 0 6vw;
    gap: 0.15em;
  }
  .cm-tease h1 {
    font-size: clamp(1.6rem, 5vw, 3.8rem);
    line-height: 1.05;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.02em;
    opacity: 0; transform: translateY(18px);
    transition: opacity 800ms cubic-bezier(.22,.61,.36,1),
                transform 800ms cubic-bezier(.22,.61,.36,1);
  }
  .cm-tease h1.line-1 {
    background: linear-gradient(135deg, #4fc3f7 0%, #7c4dff 60%, #ff6b9d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .cm-tease h1.line-2 { color: white; }
  .cm-tease h1.is-visible { opacity: 1; transform: translateY(0); }

  /* Whole tease block exits together once we're approaching the freeze frame. */
  .cm-tease.is-exiting h1 {
    opacity: 0 !important;
    transform: translateY(-8px) !important;
    transition: opacity 600ms ease, transform 600ms ease;
  }

  /* Brand title — bottom title-card position, never crosses the face. */
  .cm-brand {
    position: absolute;
    left: 0; right: 0; bottom: 6vh;
    text-align: center;
    padding: 0 6vw;
    font-size: clamp(2.2rem, 7vw, 5.4rem);
    line-height: 1;
    font-weight: 900;
    letter-spacing: -0.025em;
    background: linear-gradient(135deg, #4fc3f7 0%, #7c4dff 55%, #ff6b9d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0; transform: translateY(24px) scale(0.96);
    transition: opacity 1100ms cubic-bezier(.22,.61,.36,1),
                transform 1100ms cubic-bezier(.22,.61,.36,1);
  }
  /* Thin gradient bar under the brand — subtle finishing touch. */
  .cm-brand::after {
    content: "";
    display: block;
    margin: 0.6em auto 0;
    width: clamp(40px, 8vw, 96px);
    height: 2px;
    background: linear-gradient(90deg, transparent, #7c4dff, transparent);
    opacity: 0.7;
  }
  .cm-brand.is-visible { opacity: 1; transform: translateY(0) scale(1); }

  @media (prefers-reduced-motion: reduce) {
    .cm-tease h1, .cm-brand {
      opacity: 1 !important; transform: none !important; transition: none !important;
    }
    .cm-tease.is-exiting h1 { opacity: 0 !important; }
  }
</style>
</head>
<body dir="{{DIR}}">

<div class="cm-stage">
  <video
    id="cm-video"
    src="https://cdn.jsdelivr.net/gh/tomerblond-hapoel/cinematch-ai-hero@feat/cinematic-hero/assets/hero.mp4"
    poster="https://cdn.jsdelivr.net/gh/tomerblond-hapoel/cinematch-ai-hero@feat/cinematic-hero/assets/hero_poster.jpg"
    muted
    playsinline
    preload="auto"
    disablepictureinpicture
  ></video>

  <div class="cm-overlay">
    <div class="cm-tease" id="cm-tease">
      <h1 class="line-1" id="cm-line-1">{{LINE1}}</h1>
      <h1 class="line-2" id="cm-line-2">{{LINE2}}</h1>
    </div>
    <div class="cm-brand" id="cm-brand">{{LINE3}}</div>
  </div>
</div>

<script>
(function () {
  const FIRST_LOAD = {{FIRST_LOAD}};
  const video = document.getElementById('cm-video');
  const line1 = document.getElementById('cm-line-1');
  const line2 = document.getElementById('cm-line-2');
  const tease = document.getElementById('cm-tease');
  const brand = document.getElementById('cm-brand');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Timing as fractions of duration. On an 8s video → ~1s, ~3.5s, exit ~5.6s, brand ~6.4s.
  const T_LINE_1     = 0.12;
  const T_LINE_2     = 0.44;
  const T_TEASE_EXIT = 0.70;
  const T_BRAND_IN   = 0.80;

  // End state: only the brand title is visible.
  function showEndState() {
    tease.classList.add('is-exiting');
    line1.classList.remove('is-visible');
    line2.classList.remove('is-visible');
    brand.classList.add('is-visible');
  }

  if (reducedMotion || !FIRST_LOAD) {
    showEndState();
    const parkAtEnd = () => {
      try { video.currentTime = Math.max(0, video.duration - 0.05); video.pause(); }
      catch (e) {}
    };
    if (!isNaN(video.duration) && video.duration > 0) parkAtEnd();
    else video.addEventListener('loadedmetadata', parkAtEnd, { once: true });
    return;
  }

  video.addEventListener('timeupdate', () => {
    const d = video.duration;
    if (!d || isNaN(d)) return;
    const f = video.currentTime / d;
    if (f >= T_LINE_1)     line1.classList.add('is-visible');
    if (f >= T_LINE_2)     line2.classList.add('is-visible');
    if (f >= T_TEASE_EXIT) tease.classList.add('is-exiting');
    if (f >= T_BRAND_IN)   brand.classList.add('is-visible');
  });

  // Make sure the brand persists once the video finishes.
  video.addEventListener('ended', () => {
    tease.classList.add('is-exiting');
    brand.classList.add('is-visible');
  });

  const startPlay = () => {
    const p = video.play();
    if (p && p.catch) p.catch(() => showEndState());
  };
  if (video.readyState >= 2) startPlay();
  else video.addEventListener('loadeddata', startPlay, { once: true });
})();
</script>
</body>
</html>
