<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CineMatch — intro</title>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0e1a; color: #fff; overflow: hidden; height: 100%; }

  .cm-stage {
    position: relative;
    width: 100%; height: 100vh;
    background: #0a0e1a;
    overflow: hidden;
  }
  .cm-stage video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;            /* show the full 16:9 frame, no crop */
    background: #0a0e1a;
    pointer-events: none;
  }

  .cm-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; color: white; pointer-events: none;
    text-shadow: 0 2px 28px rgba(0,0,0,0.8), 0 0 60px rgba(0,0,0,0.5);
    font-family: 'Heebo', 'Inter', system-ui, -apple-system, sans-serif;
    padding: 0 6vw;
  }
  .cm-overlay h1 {
    font-size: clamp(2rem, 6.4vw, 5rem);
    line-height: 1.05;
    margin: 0.15em 0;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #4fc3f7 0%, #7c4dff 60%, #ff6b9d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0; transform: translateY(20px);
    transition: opacity 800ms cubic-bezier(.22,.61,.36,1), transform 800ms cubic-bezier(.22,.61,.36,1);
  }
  .cm-overlay h1.no-gradient {
    background: none;
    -webkit-text-fill-color: white;
    color: white;
  }
  .cm-overlay p {
    font-size: clamp(1rem, 1.6vw, 1.35rem);
    max-width: 44ch;
    color: rgba(232, 234, 237, 0.94);
    margin-top: 0.8em;
    opacity: 0; transform: translateY(20px);
    transition: opacity 900ms cubic-bezier(.22,.61,.36,1), transform 900ms cubic-bezier(.22,.61,.36,1);
  }
  .cm-overlay [data-chapter].is-visible {
    opacity: 1; transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .cm-overlay [data-chapter] { opacity: 1 !important; transform: none !important; transition: none !important; }
  }
</style>
</head>
<body dir="{{DIR}}">

<div class="cm-stage">
  <video
    id="cm-video"
    src="https://cdn.jsdelivr.net/gh/tomerblond-hapoel/cinematch-ai-hero@feat/cinematic-hero/assets/hero.mp4"
    poster="https://cdn.jsdelivr.net/gh/tomerblond-hapoel/cinematch-ai-hero@feat/cinematic-hero/assets/hero_poster.jpg"
    muted
    playsinline
    preload="auto"
    disablepictureinpicture
  ></video>

  <div class="cm-overlay">
    <h1 data-chapter="1">{{LINE1}}</h1>
    <h1 data-chapter="2" class="no-gradient">{{LINE2}}</h1>
    <p  data-chapter="3">{{LINE3}}</p>
  </div>
</div>

<script>
(function () {
  const FIRST_LOAD = {{FIRST_LOAD}};
  const video = document.getElementById('cm-video');
  const lines = document.querySelectorAll('[data-chapter]');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Chapter fractions of duration — when each overlay line should fade in.
  const CHAPTERS = [0.12, 0.44, 0.75];

  function showAll() {
    lines.forEach(l => l.classList.add('is-visible'));
  }

  // Reduced motion OR not first load → no animation, jump straight to "end state".
  if (reducedMotion || !FIRST_LOAD) {
    showAll();
    // Park the video on the last frame so the wonder-face holds.
    const parkAtEnd = () => {
      try { video.currentTime = Math.max(0, video.duration - 0.05); video.pause(); }
      catch (e) { /* duration not ready yet */ }
    };
    if (!isNaN(video.duration) && video.duration > 0) parkAtEnd();
    else video.addEventListener('loadedmetadata', parkAtEnd, { once: true });
    return;
  }

  // First load, motion allowed → autoplay and fade chapters in on timeupdate.
  video.addEventListener('timeupdate', () => {
    const d = video.duration;
    if (!d || isNaN(d)) return;
    const t = video.currentTime;
    CHAPTERS.forEach((frac, i) => {
      if (t >= frac * d) lines[i].classList.add('is-visible');
    });
  });

  // Some browsers ignore the autoplay attribute when JS-controlled — call play() explicitly.
  const startPlay = () => {
    const p = video.play();
    if (p && p.catch) p.catch(() => {
      // Autoplay was blocked (rare with muted+playsinline). Show poster + reveal text.
      showAll();
    });
  };
  if (video.readyState >= 2) startPlay();
  else video.addEventListener('loadeddata', startPlay, { once: true });
})();
</script>
</body>
</html>
