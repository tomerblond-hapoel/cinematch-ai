<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CineMatch — intro</title>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0e1a; color: #fff; overflow: hidden; height: 100%; }

  .cm-stage {
    position: relative;
    width: 100%; height: 100vh;
    background: #0a0e1a;
    overflow: hidden;
  }
  .cm-stage video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #0a0e1a;
    pointer-events: none;
  }

  /* Overlay sits at TOP of the stage so the face area stays clear. */
  .cm-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start;
    text-align: center; color: white; pointer-events: none;
    text-shadow: 0 2px 28px rgba(0,0,0,0.85), 0 0 60px rgba(0,0,0,0.55);
    font-family: 'Heebo', 'Inter', system-ui, -apple-system, sans-serif;
    padding: 5vh 6vw 0;
    gap: 0.15em;
  }

  .cm-overlay h1 {
    font-size: clamp(1.6rem, 4.8vw, 3.6rem);
    line-height: 1.05;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.02em;
    opacity: 0; transform: translateY(20px);
    transition: opacity 800ms cubic-bezier(.22,.61,.36,1),
                transform 800ms cubic-bezier(.22,.61,.36,1);
  }
  .cm-overlay h1.line-1 {
    background: linear-gradient(135deg, #4fc3f7 0%, #7c4dff 60%, #ff6b9d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .cm-overlay h1.line-2 {
    color: white;
  }

  /* The brand reveal — biggest element, gradient, lands as the face freezes. */
  .cm-overlay .brand {
    font-size: clamp(2.2rem, 7.2vw, 5.5rem);
    font-weight: 900;
    margin: 0.5em 0 0;
    letter-spacing: -0.025em;
    background: linear-gradient(135deg, #4fc3f7 0%, #7c4dff 60%, #ff6b9d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0; transform: translateY(24px) scale(0.96);
    transition: opacity 1100ms cubic-bezier(.22,.61,.36,1),
                transform 1100ms cubic-bezier(.22,.61,.36,1);
  }

  .cm-overlay [data-chapter].is-visible {
    opacity: 1; transform: translateY(0) scale(1);
  }

  @media (prefers-reduced-motion: reduce) {
    .cm-overlay [data-chapter] {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body dir="{{DIR}}">

<div class="cm-stage">
  <video
    id="cm-video"
    src="https://cdn.jsdelivr.net/gh/tomerblond-hapoel/cinematch-ai-hero@feat/cinematic-hero/assets/hero.mp4"
    poster="https://cdn.jsdelivr.net/gh/tomerblond-hapoel/cinematch-ai-hero@feat/cinematic-hero/assets/hero_poster.jpg"
    muted
    playsinline
    preload="auto"
    disablepictureinpicture
  ></video>

  <div class="cm-overlay">
    <h1 data-chapter="1" class="line-1">{{LINE1}}</h1>
    <h1 data-chapter="2" class="line-2">{{LINE2}}</h1>
    <div data-chapter="3" class="brand">{{LINE3}}</div>
  </div>
</div>

<script>
(function () {
  const FIRST_LOAD = {{FIRST_LOAD}};
  const video = document.getElementById('cm-video');
  const lines = document.querySelectorAll('[data-chapter]');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // When each chapter fades in, as a fraction of total duration.
  // Line 1 ~1s, Line 2 ~3.5s, Brand reveal ~6s — brand lands as the face freezes.
  const CHAPTERS = [0.12, 0.44, 0.75];

  function showAll() {
    lines.forEach(l => l.classList.add('is-visible'));
  }

  if (reducedMotion || !FIRST_LOAD) {
    showAll();
    const parkAtEnd = () => {
      try { video.currentTime = Math.max(0, video.duration - 0.05); video.pause(); }
      catch (e) {}
    };
    if (!isNaN(video.duration) && video.duration > 0) parkAtEnd();
    else video.addEventListener('loadedmetadata', parkAtEnd, { once: true });
    return;
  }

  video.addEventListener('timeupdate', () => {
    const d = video.duration;
    if (!d || isNaN(d)) return;
    const t = video.currentTime;
    CHAPTERS.forEach((frac, i) => {
      if (t >= frac * d) lines[i].classList.add('is-visible');
    });
  });

  const startPlay = () => {
    const p = video.play();
    if (p && p.catch) p.catch(() => showAll());
  };
  if (video.readyState >= 2) startPlay();
  else video.addEventListener('loadeddata', startPlay, { once: true });
})();
</script>
</body>
</html>
